# dokk's own documentation, built with dokk.
title = "dokk"
description = "A tiny static docs generator in pure Python: Markdown folders in, a fast static site out."
site_url = "https://terminalkitten.github.io/dokk/"
content_dir = "docs"

[links]
github = "https://github.com/terminalkitten/dokk"
edit_url = "https://github.com/terminalkitten/dokk/edit/main/docs/{path}"

[theme]
style = "vega"
color = "blue"

# Sidebar: pages, generated folders and external links.
[[sidebar]]
label = "Start"
items = ["index.md", "getting-started/index.md"]

[[sidebar]]
autogenerate = "guides"

[[sidebar]]
autogenerate = "reference"

[[sidebar]]
label = "Links"
items = [
  { label = "GitHub", link = "https://github.com/terminalkitten/dokk" },
  { label = "Basecoat", link = "https://basecoatui.com" },
  { label = "Pagefind", link = "https://pagefind.app" },
]

[llms]
enabled = true  # writes llms.txt and llms-full.txt

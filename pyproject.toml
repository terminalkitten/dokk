[project]
name = "dokk"
dynamic = ["version"]
description = "A tiny static docs generator in pure Python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "terminalkitten", email = "25918382+terminalkitten@users.noreply.github.com" }]
requires-python = ">=3.11"
keywords = [
    "docs",
    "documentation",
    "documentation-generator",
    "documentation-tool",
    "python",
    "static",
    "static-site",
    "static-site-generator",
    "markdown",
    "github-pages",
    "basecoat",
    "shadcn",
    "jinja2",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
]
dependencies = [
    "jinja2>=3.1.6",
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
    "pygments>=2.21.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
serve = ["watchfiles>=1.3.0"]
search = ["pagefind[bin]>=1.5.2"]
# Floors at the latest minor release
dev = [
    "pytest>=9.1",
    "ruff>=0.17",
    "ty>=0.0.89",
    # Markdown formatting
    "mdformat>=1.0.0",
    "mdformat-directives>=0.0.1",
    "mdformat-frontmatter>=2.1.2",
    "mdformat-gfm>=1.0.0",
    "mdformat-footnote>=0.1.3",
    "mdformat-deflist>=0.1.4",
]
e2e = ["playwright>=1.64"]  # browser smoke tests

[project.scripts]
dokk = "dokk.cli:main"

[project.urls]
Homepage = "https://terminalkitten.github.io/dokk/"
Documentation = "https://terminalkitten.github.io/dokk/"
Repository = "https://github.com/terminalkitten/dokk"
Issues = "https://github.com/terminalkitten/dokk/issues"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { version_scheme = "no-guess-dev", fallback_version = "0.0.0" }

[tool.hatch.build.targets.sdist]
# only what is needed to build the wheel
only-include = ["src", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/dokk"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["examples"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# With PYTHONWARNDEFAULTENCODING=1
filterwarnings = ["error::EncodingWarning"]

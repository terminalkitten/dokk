[project]
name = "dokk"
dynamic = ["version"]  # from src/dokk/__init__.py
description = "Small static documentation generator"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.6",
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
    "pygments>=2.21.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
serve = ["watchfiles>=1.3.0"]
search = ["pagefind[bin]>=1.5.2"]
# Floors at the latest minor release; bump them to the newest minor when updating.
dev = ["pytest>=9.1", "ruff>=0.17", "ty>=0.0.89"]
e2e = ["playwright>=1.64"]  # browser smoke tests; also run: playwright install chromium

[project.scripts]
dokk = "dokk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/dokk/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dokk"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["examples"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
